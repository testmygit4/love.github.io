<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruzzka</title>
<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:black;
overflow:hidden;
font-family:monospace;
}
.heart{
position:absolute;
color:#ff2b2b;
white-space:pre;
line-height:1;
animation:fall linear infinite;
}
@keyframes fall{
from{transform:translateY(-120%);opacity:0}
10%{opacity:1}
to{transform:translateY(120vh);opacity:0}
}
@media (max-width:600px){
.heart{
font-size:12px;
}
}
</style>
</head>
<body>
<script>
const heart=`   
 ******   ******
*****************
**** Ruzzka <3****
 *****************
  ***************
    ***********
      *******
        ***`

const count=window.innerWidth<600?6:10

for(let i=0;i<count;i++){
let h=document.createElement("pre")
h.className="heart"
h.textContent=heart
h.style.left=Math.random()*90+"vw"
h.style.animationDuration=18+Math.random()*12+"s"
h.style.animationDelay=Math.random()*-30+"s"
document.body.appendChild(h)
}
</script>
</body>
</html>
